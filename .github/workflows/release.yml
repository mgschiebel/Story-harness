name: Release

# Publishes a release: builds the Linux x64 binary, creates the version tag
# and a GitHub Release, and rebuilds the `dist` branch (the plugin files plus
# the binary, built together from one version). Writers' plugins install from
# `dist`; `main` holds source only.
#
# Two ways to start it:
# - "Run workflow" on main (Actions tab, or the REST API). The version comes
#   from Cargo.toml; the workflow creates tag v<version> itself and refuses
#   if that tag already exists. This is the usual way: cloud build sessions
#   can't push tags.
# - Pushing a version tag (for example v0.1.0) whose number matches Cargo.toml.
#
# Phase 1 builds Linux x64 only. macOS, Windows and Linux ARM (via cargo-dist)
# and signing come with the public-release phase.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Work out the version and tag
        id: version
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print([p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="skaldsaga"][0])')
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Releases are made from main, not $GITHUB_REF" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists. Bump the version in Cargo.toml and plugin.json first." >&2
              exit 1
            fi
          elif [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Assemble the distribution folder
        run: |
          set -eu
          sh ci/assemble-dist.sh dist target/release/skaldsaga
          cat > dist/README.md <<EOF
          # Skaldsaga (distribution build)

          Built automatically from tag ${{ steps.version.outputs.tag }} (commit ${GITHUB_SHA}).
          Do not edit this branch by hand; source lives on \`main\`.

          Install in Claude Code:

              /plugin marketplace add mgschiebel/skaldsaga#dist
              /plugin install skaldsaga@skaldsaga
          EOF
          sh dist/scripts/skaldsaga --version
          tar -C dist -czf "skaldsaga-${{ steps.version.outputs.version }}-linux-x64.tar.gz" .

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the tag at this commit if it doesn't exist yet (the "Run workflow" path).
          gh release create "${{ steps.version.outputs.tag }}" \
            "skaldsaga-${{ steps.version.outputs.version }}-linux-x64.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "Skaldsaga ${{ steps.version.outputs.tag }}" \
            --notes "Phase 1 test build (not a public release). Linux x64 only, unsigned." \
            --prerelease

      - name: Update the dist branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work=$(mktemp -d)
          if git ls-remote --exit-code --heads origin dist >/dev/null; then
            git fetch --depth 1 origin dist
            git worktree add "$work" FETCH_HEAD
          else
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan dist
          fi
          git -C "$work" rm -rqf --ignore-unmatch .
          cp -a dist/. "$work/"
          git -C "$work" add -A
          git -C "$work" commit -q -m "Build ${{ steps.version.outputs.tag }} from $GITHUB_SHA"
          git -C "$work" push origin HEAD:refs/heads/dist
